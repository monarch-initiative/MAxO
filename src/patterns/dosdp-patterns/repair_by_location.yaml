pattern_name: repair_by_location
pattern_iri: http://purl.obolibrary.org/obo/maxo/patterns/repair_by_location.yaml
description: "Surgical repair of a particular organ"

contributors:
  - https://orcid.org/0000-0001-7941-2961

classes:
  thing: owl:Thing
  repair: MAXO:0009072
  location: UBERON:0001062

relations:
  has_input: RO:0002233
  part_of: BFO:0000050
  
annotationProperties:
  exact_synonym: oio:hasExactSynonym 
  created_by: http://purl.org/dc/terms/creator
  date: dc:date
  comment: rdfs:comment
  xref: oio:hasDbXref
 
vars:
  created_by: "'thing'"
  location: "'location'"
  
data_vars:
  date: "'date'"
  comment: "'comment'"
  xref: "database cross reference"

data_list_vars:
  syns: xsd:string
  xrefs_def: xsd:string

name:
  text: "surgical repair of %s"
  vars:
   - location

annotations:
  - annotationProperty: exact_synonym
    text: "%s surgical repair"
    vars:
     - location
     
  - annotationProperty: date
    text: "%s"
    vars:
     - date
     
  - annotationProperty: created_by
    var: created_by

  - annotationProperty: comment
    text: "%s"
    vars:
     - comment
    
  - annotationProperty: xref
    text: "%s"
    vars:
     - xref

exact_synonym:
  value: syns

def:
  text: "A surgery that fixes or mends %s."
  xrefs: xrefs_def
  vars:
    - location

equivalentTo:
  text: "'repair' and 'has_input' some ('part_of' some %s)"
  vars:
    - location
   
